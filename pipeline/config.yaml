# Climate Security Index Configuration
project:
  id: climate-security-index
  name: "Climate Security Index"
  description: "Compound climate-security risk scoring."

openrouter:
  model: "openrouter/free"
  fallback_model: "openrouter/free"

gdelt_query: "climate drought food security"
include_forex: true

sources:
  - name: "GDELT"

refresh:
  interval_hours: 6
  retry_attempts: 3

scoring:
  scale: "1-10"
  thresholds:
    high: 7
    medium: 4
    low: 0
