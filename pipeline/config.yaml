# Climate Security Index Configuration
project:
  id: climate-security-index
  name: "Climate Security Index"
  description: "Compound climate-security risk scoring."

openrouter:
  model: "nvidia/nemotron-3-super-120b-a12b:free"
  fallback_model: "z-ai/glm-5.2:free"

news_query: "(climate OR drought OR famine OR agriculture)"
include_forex: true

sources:
  - name: "Google News RSS"

refresh:
  interval_hours: 6
  retry_attempts: 3

scoring:
  scale: "1-10"
  thresholds:
    high: 7
    medium: 4
    low: 0
